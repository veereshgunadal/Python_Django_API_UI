<!DOCTYPE html>
{% load staticfiles %}
<head>
    <title>Login Page</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
    <link rel="stylesheet" href="{% static 'bootstrap.min.css' %}">
</head>
<body>
    <div class="before-main">
        <h1 style="color:whitesmoke"> Orange </h1>
    </div>
    <main class="form-signin w-100 m-auto">
        <form action="/logincheck/" method="get">
            <p style="color:lightgoldenrodyellow">Please sign in</p>
            <div class="form-floating">
                <input class="form-control" for="username" type="text" name="username" placeholder="username">
                <label id="username">user name</label>
            </div>
            <div class="form-floating">
                <input class="form-control" for="password" type="password" name="password" placeholder="password">
                <label id="password">password</label>
            </div>
            <div class="form-check text-start my-3">
                <input class="form-check-input" for="remember me" type="checkbox" name="remember me">
                <label style="color:black" class="form-check-label" id="remember me">Remember me</label>
            </div>
            <div>
                <button class="btn btn-primary" type="submit" name="signin">Sign in</button>
                &nbsp;<a href="/register/" style="color:white">Register</a>
            </div>
        </form>
    </main>
</body>
